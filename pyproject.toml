[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centerpoint-from-scratch"
version = "0.0.0"
description = "An educational from-scratch reimplementation of CenterPoint."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["centerpoint*"]
